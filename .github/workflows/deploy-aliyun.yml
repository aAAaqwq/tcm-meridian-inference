name: Build and Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: crpi-lwz264sedmauvivo.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: danielli/tcm-meridian-inference
  FORK_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull cache from Aliyun ACR (ignore if not exists)
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache || echo "Cache image not found, will build without cache"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            # Check if cache exists and set appropriate flags
            CACHE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache"
            if docker manifest inspect "$CACHE_TAG" > /dev/null 2>&1; then
              CACHE_ARGS="--cache-from type=registry,ref=$CACHE_TAG --cache-to type=registry,ref=$CACHE_TAG,mode=max"
              echo "Using existing cache..."
            else
              CACHE_ARGS=""
              echo "No cache found, building from scratch..."
            fi

            docker buildx build --platform linux/amd64 --push \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              $CACHE_ARGS .
        env:
          DOCKER_BUILDKIT: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            echo "=== TCM API Deployment Start ==="

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="tcm-api"
            PORT="18790"

            echo "Image: $IMAGE"

            # 登录阿里云容器镜像服务
            echo "Logging into Aliyun ACR..."
            echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin

            # 拉取最新镜像
            echo "Pulling image: $IMAGE"
            docker pull $IMAGE

            # 停止并删除旧容器
            echo "Stopping old container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --memory=1g --memory-swap=1g \
              --health-cmd="python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:$PORT/health')\"" \
              --health-interval=15s --health-timeout=5s --health-retries=3 --health-start-period=30s \
              -p $PORT:$PORT \
              -e TCM_API_PORT=$PORT \
              -e TCM_INFER_MODE="${{ secrets.TCM_INFER_MODE || 'auto' }}" \
              -e TCM_LOG_LEVEL="${{ secrets.TCM_LOG_LEVEL || 'INFO' }}" \
              -e DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
              -e DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}" \
              -e PYTHONUNBUFFERED=1 \
              -e MALLOC_ARENA_MAX=2 \
              $IMAGE

            # 等待服务启动
            echo "Waiting for service..."
            sleep 5

            # 健康检查 - 使用 docker exec 调用容器内 Python（不依赖宿主机 curl）
            HEALTH=$(docker exec $CONTAINER_NAME python3 -c "import urllib.request,sys;resp=urllib.request.urlopen('http://localhost:$PORT/health');print(resp.read().decode())" 2>&1)

            if echo "$HEALTH" | grep -q '"status": "ok"'; then
              echo "✅ Health check passed"
              echo "$HEALTH"
            else
              echo "⚠️ Health check failed"
              echo "$HEALTH"
              docker logs $CONTAINER_NAME --tail 20
              exit 1
            fi

            echo "=== Deployment Completed ==="
            echo "API URL: http://${{ secrets.SSH_HOST }}:$PORT"
